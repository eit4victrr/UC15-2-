<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Consulta de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Portal de Notas Acadêmicas</h1>
        
        <form id="form-notas" onsubmit="event.preventDefault();">
            <div class="input-group">
                <label for="nome">Nome do Estudante:</label>
                <input type="text" id="nome" placeholder="Digite o nome completo" required>
            </div>

            <div class="notas-container">
                <div class="input-group">
                    <label for="nota1">Nota 1:</label>
                    <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="0.0" required>
                </div>
                <div class="input-group">
                    <label for="nota2">Nota 2:</label>
                    <input type="number" id="nota2" min="0" max="10" step="0.1" placeholder="0.0" required>
                </div>
                <div class="input-group">
                    <label for="nota3">Nota 3:</label>
                    <input type="number" id="nota3" min="0" max="10" step="0.1" placeholder="0.0" required>
                </div>
            </div>

            <div class="botoes-container">
                <button type="button" id="btn-calcular" onclick="calcularMedia()">Calcular Média</button>
                <button type="button" id="btn-limpar" onclick="limparCampos()">Limpar Consulta</button>
            </div>
        </form>

        <div id="resultado" class="resultado-oculto">
            <!-- Os resultados e mensagens de erro aparecerão aqui via JavaScript -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
